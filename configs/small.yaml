# hotsteel0.1 训练与模型配置
# 所有关键超参数集中于此，便于复现实验。

project:
  name: hotsteel0.1
  seed: 1337

paths:
  corpus: data/corpus_zh.jsonl          # 问答语料 (jsonl)
  tokenizer_dir: data/tokenizer         # BPE 词表输出目录
  checkpoint_dir: checkpoints           # 权重输出目录
  log_dir: checkpoints/logs

data:
  # 序列拼接格式：<|user|>提问<|assistant|>回答<|end|>
  max_seq_len: 256            # 单条样本最大 token 数
  val_ratio: 0.02             # 验证集比例
  num_workers: 0              # Windows 下建议 0
  packing: false              # false=逐样本对齐(推荐)；true=拼接打包
  mask_instruction: true      # 只在回答部分计算损失（提升回答对齐）

tokenizer:
  vocab_size: 4096            # BPE 词表大小
  min_frequency: 2
  special_tokens: ["<pad>", "<|user|>", "<|assistant|>", "<|end|>", "<unk>"]

model:
  d_model: 384                # 隐藏维度
  n_layer: 6                  # Transformer 层数
  n_head: 6                   # 注意力头数
  d_ff: 1024                  # FFN 中间维度
  dropout: 0.1
  rope_theta: 10000.0         # RoPE 基频
  tie_embeddings: true        # 输入/输出 embedding 共享
  use_swiglu: true            # 使用 SwiGLU 前馈

train:
  batch_size: 64
  grad_accum_steps: 1
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_iters: 150
  max_iters: 600              # 训练总步数（小语料下防止过拟合）
  eval_interval: 50
  eval_iters: 30
  log_interval: 20
  save_interval: 200
  device: auto                # auto 会自动选中 cuda
  dtype: auto                 # cuda 上自动使用 bfloat16
  compile: false              # torch.compile（首次编译较慢，可选开启）

generate:
  max_new_tokens: 128
  temperature: 0.8
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.1
  greedy: false
